// ルートはまとめ役だけ。中身は forge-1.20.1/ と neoforge-1.21.1/ の build.gradle。
//
// ./gradlew build で 2 つの jar ができ、どちらもルートの build/libs/ へ集まる
//   kurumamod-forge-1.20.1-<version>.jar
//   kurumamod-neoforge-1.21.1-<version>.jar

tasks.register('build') {
    group = 'build'
    description = '両方の jar を作ってルートの build/libs/ へ集める'
    dependsOn ':forge-1.20.1:build', ':neoforge-1.21.1:build'
}

tasks.register('clean', Delete) {
    group = 'build'
    dependsOn ':forge-1.20.1:clean', ':neoforge-1.21.1:clean'
    delete layout.buildDirectory
}
