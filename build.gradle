// ルートはまとめ役だけ。中身は versions/1.20.1/forge/ と versions/1.21.1/neoforge/ の build.gradle。
//
// ./gradlew build で 2 つの jar ができ、どちらもルートの build/libs/ へ集まる
//   kurumamod-forge-1.20.1-<version>.jar
//   kurumamod-neoforge-1.21.1-<version>.jar
//   kurumamod-fabric-1.21.1-<version>.jar

tasks.register('build') {
    group = 'build'
    description = 'すべての jar を作ってルートの build/libs/ へ集める'
    dependsOn ':forge-1.20.1:build', ':neoforge-1.21.1:build', ':fabric-1.21.1:build'
}

tasks.register('clean', Delete) {
    group = 'build'
    dependsOn ':forge-1.20.1:clean', ':neoforge-1.21.1:clean', ':fabric-1.21.1:clean'
    delete layout.buildDirectory
}
