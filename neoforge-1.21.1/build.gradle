plugins {
    id 'java-library'
    id 'idea'
    // NeoForge の開発環境（ModDevGradle）。1.20.5 以降の NeoForge は実行時も Mojang の名前で走るので、
    // 配布 jar の難読化（reobf）も refmap も無い
    id 'net.neoforged.moddev' version '2.0.148'
}


// 手元だけの設定。<b>gradle.properties へ書いてはいけない</b>——あれは公開される
// ファイルなので、各自の環境の絶対パスが混ざる。gradle-local.properties は
// .gitignore 済みで、無ければ黙って何も足さずに素通りする。
// 書き方は gradle-local.properties.example
//
// <b>UTF-8 で読むこと。</b>Properties.load(InputStream) は仕様上 ISO-8859-1 で
// 読むので、日本語を含むパスを書いた人の設定が化ける（.properties を英語で
// 書いているのも同じ事情。IntelliJ も既定で ISO-8859-1 として表示する）
def localPropsFile = rootProject.file('gradle-local.properties')
if (localPropsFile.exists()) {
    def localProps = new Properties()
    localPropsFile.withReader('UTF-8') { localProps.load(it) }
    localProps.each { key, value -> project.ext.set(key.toString(), value.toString()) }
}

group = mod_group_id
version = mod_version

base {
    // ルートの build/libs/ に Forge 版と並ぶので、どちら向けか名前で分かるようにする
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    // 実行の設定。<b>作業ディレクトリは 1.20.1 版（run/ など）と分けてある。</b>同じ run/ で
    // 起動すると、開発用のワールドが 1.21.1 へ変換されて 1.20.1 版で開けなくなるため。
    //
    // <b>名前に neo を付けてある</b>（タスクは runNeoClient1 など）。Forge 版と同じ runClient1 に
    // すると、ルートで ./gradlew runClient1 と打ったときに両方の版が同時に起動する
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        neoClient {
            client()
            gameDirectory = rootProject.file('run-neo')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // 既定の 854x480 では狭すぎて、メーターや調整画面の重なりが実際の
            // 見え方と食い違う。<b>Minecraft は窓の大きさを保存しない</b>ので、
            // 起動のたびに引数で渡すしかない
            programArguments.addAll '--width', '1920', '--height', '1080'
        }

        // マルチプレイ検証用の 2 人。オフラインの UUID は名前から作られるので、
        // 名前を分けないと同一人物と見なされて先に入っていた方が蹴り出される。
        // 作業ディレクトリも分ける（options.txt とログを取り合うため）
        neoClient1 {
            client()
            gameDirectory = rootProject.file('run-neo')
            programArguments.addAll '--width', '1920', '--height', '1080', '--username', 'Dev'
        }

        neoClient2 {
            client()
            gameDirectory = rootProject.file('run-neo-client2')
            programArguments.addAll '--width', '1920', '--height', '1080', '--username', 'Dev2'
        }

        neoServer {
            server()
            gameDirectory = rootProject.file('run-neo-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        neoData {
            data()
            gameDirectory = rootProject.file('run-neo-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 物理・諸元と、両方の版で同じリソース（assets・車種・部品）。Forge 版も同じものを取り込む
sourceSets.main.java { srcDir rootProject.file('core/src/main/java') }
sourceSets.main.resources { srcDir rootProject.file('core/src/main/resources') }

// 開発環境へ持ち込む外部 MOD（1.21.1 用）。gradle-local.properties の
// neo_extra_mods_dir（場所）と neo_extra_mods（jar のファイル名を , 区切り）。
// 1.20.1 版の extra_mods とは別の項目にしてある——同じ gradle-local.properties を
// 両方のブランチで使うので、1.20.1 用の jar が紛れ込むと起動できない。
//
// NeoForge は開発環境も配布 jar も同じ Mojang の名前で走るので、1.20.1 版のような
// 難読化の解除（fg.deobf）は要らない。<b>起動の前に run-neo*/mods/ へ写すだけ</b>。
//
// <b>runtimeOnly files(...) でクラスパスへ足してはいけない。</b>jar は「見つかった」と
// ログに出るのに MOD として登録されず、Iris が「Sodium が無い」と言って起動が止まった
//
// <b>neo_extra_mods にはフルパスも書ける</b>（自分でビルドした MOD の build/libs など、
// neo_extra_mods_dir 以外の場所の jar）。ファイル名だけなら neo_extra_mods_dir から探す
def neoExtraModsDir = project.findProperty('neo_extra_mods_dir')
def neoExtraMods = (project.findProperty('neo_extra_mods') ?: '').split(',')
        .collect { it.trim() }.findAll { !it.isEmpty() }
        .collect { new File(it).isAbsolute() ? new File(it) : (neoExtraModsDir != null ? new File(neoExtraModsDir, it) : null) }
        .findAll { it != null && it.isFile() }

[NeoClient: 'run-neo', NeoClient1: 'run-neo', NeoClient2: 'run-neo-client2'].each { suffix, dir ->
    def copy = tasks.register("copyExtraMods${suffix}", Copy) {
        from neoExtraMods
        into rootProject.file("${dir}/mods")
    }
    tasks.matching { it.name == "run${suffix}" }.configureEach { dependsOn copy }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license,
                             mod_version            : mod_version, mod_authors: mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    // 日本語のコメントを含むので UTF-8 で読む（既定は OS の文字コード）
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// 生成した neoforge.mods.toml をリソースとして jar と開発環境へ載せる
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    // ライセンス条文を jar に同梱する。GPLv3 は「本ライセンスの写しを一緒に渡すこと」を
    // 求めている（第 4 節）ので、これは礼儀ではなく条件
    from(rootProject.file('LICENSE'))
}

// できた jar をルートの build/libs/ へも置く（Forge 版と並べて受け取れるように）
tasks.named('build').configure {
    doLast {
        copy {
            from tasks.named('jar').flatMap { it.archiveFile }
            into rootProject.layout.buildDirectory.dir('libs')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
