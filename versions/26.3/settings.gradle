// Minecraft 26.3 のビルド。<b>ルートのビルドとは別の Gradle のビルド</b>（このフォルダの gradlew で動く）。
//
// 26.3 の開発環境の道具（ModDevGradle・Loom・ForgeGradle）は Gradle 9 系を要るが、1.20.1 の ForgeGradle 6 は
// Gradle 8 系でしか動かない。Gradle の版はビルド全体で 1 つしか選べないので、26.3 だけ別のビルドにしてある。
// MOD の共通の値（mod_id・mod_version など）はルートの gradle.properties を読む（build.gradle）。
//
//   versions/26.3/common/    Minecraft 26.3 に触るが、ローダーには触らないコード
//   versions/26.3/neoforge/  NeoForge 26.3 の jar
//   versions/26.3/fabric/    Fabric 26.3 の jar
//   versions/26.3/forge/     Forge 26.3 の jar
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'kurumamod-26.3'

[
        'neoforge-26.3': 'neoforge',
        'fabric-26.3'  : 'fabric',
        'forge-26.3'   : 'forge',
].each { name, dir ->
    include name
    project(":${name}").projectDir = file(dir)
}
