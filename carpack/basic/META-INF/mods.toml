# KurumaMod の公式カーパック。コードを一切持たない MOD jar。
#
# Forge の MOD jar は自動でデータパック兼リソースパックとして読まれるので、
# 諸元（data/）と見た目（assets/）を 1 ファイルにまとめて配れる。
modLoader = "lowcodefml"
loaderVersion = "[47,)"
license = "All Rights Reserved"

[[mods]]
modId = "kurumamod_basic_carpack"
version = "1.0.0"
displayName = "KurumaMod Basic Car Pack"
# MOD 一覧に出る画像。jar の直下からの名前で書く
logoFile = "kurumamod_basic_carpack.png"
# MOD 一覧に出る説明文。読む相手が日本語話者とは限らないので英語で書く
description = '''The official car pack for KurumaMod.'''

# KurumaMod が無いと車種を読む側がいないので、必須依存にする
[[dependencies.kurumamod_basic_carpack]]
modId = "kurumamod"
mandatory = true
versionRange = "[1.2.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.kurumamod_basic_carpack]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"
