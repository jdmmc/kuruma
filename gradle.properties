org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Values shared by the Forge 1.20.1 and NeoForge 1.21.1 builds. Per-build values live in versions/1.20.1/forge/ and versions/1.21.1/neoforge/gradle.properties
mod_id=kurumamod
# The human-readable display name for the mod.
mod_name=KurumaMod
# GNU General Public License v3.0 only. Full text in LICENSE (the verbatim GPLv3; do not modify it).
# Write the SPDX identifier as-is. This string is shown in the mod list (license in mods.toml).
mod_license=GPL-3.0-only
# The mod version. See https://semver.org/
mod_version=2.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.jdmmc
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Deexel
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Next generation car simulator mod.
# Where ./gradlew publishMods uploads to. Project IDs are public, so they can live here.
# Never put tokens in this file: use curseforge_token / modrinth_token in ~/.gradle/gradle.properties
# CurseForge: the numeric "Project ID" on the right of the project page. Modrinth: project ID or slug.
curseforge_project_id=1646658
modrinth_project_id=ghlgwxFS
